x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile.nelson
  volumes:
    - ~/.nanobot:/root/.nanobot

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    restart: unless-stopped
    ports:
      - 18790:18790
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY}
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - n8n_reportes

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
    networks:
      - n8n_reportes

networks:
  n8n_reportes:
    external: true
